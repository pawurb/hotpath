name: Cloud meta benchmark relay

on:
  workflow_run:
    workflows: ["Cloud meta benchmark"]
    types: [completed]

# This repo is the first consumer of its own relay: `hotpath-relay.yml` is the
# reusable workflow adopters call, and everything the upload needs lives there.
jobs:
  relay:
    uses: ./.github/workflows/hotpath-relay.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      benchmark: meta
      artifact_name: meta-report
      report_file: meta-report.json
