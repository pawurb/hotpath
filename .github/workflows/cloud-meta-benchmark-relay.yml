name: Cloud meta benchmark relay

on:
  workflow_run:
    workflows: ["Cloud meta benchmark"]
    types: [completed]

# Uploads the report a pull request job produced. That job runs the pull
# request's code and gets no OIDC token; this one holds the token and never
# checks out or executes anything from the pull request - it unzips an
# artifact, checks it with `jq` and makes one HTTP request.
#
# The artifact is a document the pull request wrote, and its pull request
# context (number, base/head refs, event-time base sha) is taken at face value:
# lying there only misdirects or distorts the pull request's own comment, and
# the fork's job read those values from its `pull_request` event, which is a
# better source than anything this job could look up after the fact. Only the
# two fields that could affect other reports are enforced. `ci.event` has to be
# `pull_request` - claiming `push` on `refs/heads/main` would make the report
# the baseline every later pull request is compared against - and
# `meta.benchmark` is pinned, since the server prefers it over the
# `?benchmark=` query and a forged value would file the report under another
# series.
#
# `workflow_run` only ever runs the copy of this file on the default branch, so
# changes here do nothing until they are merged.

concurrency:
  # `workflow_run.pull_requests` is empty for fork pull requests, so the fork
  # branch identifies the run instead of the pull request number.
  group: meta-relay-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  relay:
    name: relay meta benchmark
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # download the artifact from the benchmark run
      contents: read
      id-token: write # mint the token hotpath.rs authenticates
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download the report
        uses: actions/download-artifact@v4
        with:
          name: meta-report
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # `ci.pull_request.head_sha` is the one claim `workflow_run` can be
      # checked against; a mismatch means the artifact is not from the commit
      # that triggered this run.
      - name: Check the report
        run: |
          set -euo pipefail
          size=$(stat -c %s artifact/meta-report.json)
          if [ "$size" -gt 5000000 ]; then
            echo "::error::report is $size bytes, over the server's 5 MiB limit"
            exit 1
          fi
          jq -e --arg sha "$HEAD_SHA" \
            '.meta.ci.event == "pull_request" and .meta.ci.pull_request.head_sha == $sha' \
            artifact/meta-report.json > /dev/null

          jq '.meta.benchmark = "meta" | .meta.source_root = ""' \
            artifact/meta-report.json > upload.json

      - name: Upload to hotpath.rs
        run: |
          set -euo pipefail
          # `ACTIONS_ID_TOKEN_REQUEST_URL` always carries an `api-version`
          # query, so the audience is appended with `&`.
          token=$(curl -sS --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hotpath.rs" | jq -r .value)
          curl -sS --fail-with-body -X POST \
            "https://hotpath.rs/api/v1/reports?benchmark=meta" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @upload.json > response.json
          {
            echo "## hotpath.rs meta benchmark"
            echo '```'; jq . response.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
